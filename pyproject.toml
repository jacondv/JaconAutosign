[project]
name = "autosign"
version = "0.1.0"
description = "Ky so PDF hang loat theo template vi tri chu ky"
requires-python = ">=3.10"
dependencies = [
    "pyhanko[image-support]>=0.25.0",
    "pypdfium2>=4.30.0",
    "pypdf>=4.3.0",
    "PySide6>=6.7.0",
    "cryptography>=42.0.0",
]

[project.scripts]
autosign = "autosign.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
